[env]
platform = espressif32@7.1.3
framework = arduino
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
extra_scripts = pre:buildscript_versioning.py
                post:copy_firmware.py
lib_deps =
    https://github.com/alanswx/ESPAsyncWiFiManager.git
    https://github.com/mathieucarbou/ESPAsyncWebServer.git
    https://github.com/IPdotSetAF/ESPAsyncHTTPUpdateServer.git
    https://github.com/mlesniew/PicoMQTT.git

[env:esp32c3]
board = esp32-c3-devkitm-1
upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_1C:DB:D4:E3:8A:D4-if00
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_1C:DB:D4:E3:8A:D4-if00
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32s3]
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.arduino.memory_type = qio_qspi
upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_E4:B3:23:F8:FB:2C-if00
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_E4:B3:23:F8:FB:2C-if00
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
