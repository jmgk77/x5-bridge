[env:esp32-c3]
platform = espressif32@7.1.3
board = esp32-c3-devkitm-1
framework = arduino
upload_speed = 921600
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-s3]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
upload_port = /dev/ttyACM0
upload_speed = 921600
monitor_speed = 115200
; modulo testado: 4MB flash + 2MB PSRAM embutidas
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_build.arduino.memory_type = qio_qspi
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

[env:esp32cam]
platform = espressif32@7.1.3
board = esp32cam
framework = arduino
upload_port = /dev/ttyUSB0
upload_speed = 460800
monitor_speed = 115200
lib_deps = espressif/esp32-camera
build_flags = -DCAMERA_PROBE

[env:esp32dev]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
upload_port = /dev/ttyUSB0
upload_speed = 115200
monitor_speed = 115200
